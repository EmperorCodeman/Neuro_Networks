<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MNIST from scratch neural network hero">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0f1933"/>
    <stop offset="100%" stop-color="#05080f"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#27d7ff"/>
    <stop offset="50%" stop-color="#b86cff"/>
    <stop offset="100%" stop-color="#ffd166"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#244169" stroke-width="1" opacity="0.38"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27d7ff"/></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffd166"/></marker>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .h { font-size: 46px; font-weight: 900; fill: #f7fbff; letter-spacing: 1.5px; }
    .sub { font-size: 22px; fill: #cfeaff; }
    .small { font-size: 17px; fill: #d7e9ff; }
    .micro { font-size: 14px; fill: #d7e9ff; }
    .dark { fill:#07111f; }
  </style>
</defs>
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<text x="600" y="62" class="t h" text-anchor="middle">MNIST FROM SCRATCH</text>
<text x="600" y="101" class="t sub" text-anchor="middle">A handwritten digit classifier built by implementing the learning engine directly.</text>
<text x="600" y="132" class="t small" text-anchor="middle">28x28 pixels -&gt; tensors -&gt; layers -&gt; loss -&gt; gradients -&gt; trained digit prediction</text>
