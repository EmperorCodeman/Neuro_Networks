<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fortnite stats lab hero banner">

<style>
  .bg{fill:#08111f}.panel{fill:#111827;stroke:#38bdf8;stroke-width:3}.panel2{fill:#17112d;stroke:#a855f7;stroke-width:3}
  .grid{stroke:#243b63;stroke-width:1}.cyan{fill:#22d3ee}.pink{fill:#f472b6}.yellow{fill:#fde047}.green{fill:#4ade80}.purple{fill:#a78bfa}.orange{fill:#fb923c}.white{fill:#e5f2ff}.muted{fill:#94a3b8}
  .title{font-family:Arial,sans-serif;font-weight:700;font-size:44px}.sub{font-family:Arial,sans-serif;font-weight:700;font-size:22px}.small{font-family:Arial,sans-serif;font-weight:600;font-size:16px}.tiny{font-family:Arial,sans-serif;font-weight:600;font-size:12px}.mono{font-family:'Courier New',monospace;font-weight:700;font-size:18px}.monoSmall{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
</style>

<rect width="1200" height="420" rx="28" class="bg"/>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".45" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 350 C230 300 360 390 550 340 C760 280 920 380 1200 310 L1200 420 L0 420Z" fill="#0f172a"/>
<g opacity=".55">
  <path d="M40 65h1120M40 120h1120M40 175h1120M40 230h1120M40 285h1120M40 340h1120" class="grid"/>
  <path d="M120 30v360M240 30v360M360 30v360M480 30v360M600 30v360M720 30v360M840 30v360M960 30v360M1080 30v360" class="grid"/>
</g>
<circle cx="980" cy="124" r="72" fill="none" stroke="#a855f7" stroke-width="10" opacity=".75"/>
<circle cx="980" cy="124" r="35" fill="none" stroke="#f472b6" stroke-width="6" opacity=".8"/>
<path d="M940 124h80M980 84v80" stroke="#f472b6" stroke-width="4"/>
<g filter="url(#glow)">
  <rect x="70" y="60" width="740" height="220" rx="24" fill="#0b1020" stroke="url(#g)" stroke-width="5"/>
  <text x="105" y="125" class="title white">Did an eSports Coach</text>
  <text x="105" y="180" class="title yellow">Improve Me?</text>
  <text x="108" y="228" class="sub cyan">Fortnite performance vs. hypothesis testing</text>
  <text x="108" y="262" class="mono muted">pre-match stats -> z-scores -> weighted verdict</text>
</g>
<g transform="translate(825,235)">
  <rect x="0" y="0" width="275" height="90" rx="18" class="panel"/>
  <path d="M40 63 L72 25 L104 63 Z" fill="#4ade80" opacity=".9"/>
  <rect x="125" y="26" width="22" height="40" class="cyan"/><rect x="157" y="12" width="22" height="54" class="pink"/><rect x="189" y="34" width="22" height="32" class="yellow"/>
  <text x="28" y="86" class="tiny muted">BATTLE ROYALE DATA LAB</text>
</g>
</svg>