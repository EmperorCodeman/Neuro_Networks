7ff"/><rect x="166" y="237" width="7" height="7" fill="#17254a"/><rect x="118" y="245" width="7" height="7" fill="#27d7ff"/><rect x="126" y="245" width="7" height="7" fill="#17254a"/><rect x="134" y="245" width="7" height="7" fill="#17254a"/><rect x="142" y="245" width="7" height="7" fill="#17254a"/><rect x="150" y="245" width="7" height="7" fill="#17254a"/><rect x="158" y="245" width="7" height="7" fill="#27d7ff"/><rect x="166" y="245" width="7" height="7" fill="#17254a"/><rect x="118" y="253" width="7" height="7" fill="#17254a"/><rect x="126" y="253" width="7" height="7" fill="#27d7ff"/><rect x="134" y="253" width="7" height="7" fill="#27d7ff"/><rect x="142" y="253" width="7" height="7" fill="#27d7ff"/><rect x="150" y="253" width="7" height="7" fill="#27d7ff"/><rect x="158" y="253" width="7" height="7" fill="#17254a"/><rect x="166" y="253" width="7" height="7" fill="#17254a"/><text x="245" y="231" class="t micro" text-anchor="middle">28 x 28 = 784 values</text>
