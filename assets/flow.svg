<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-label="MNIST project flow">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0f1933"/>
    <stop offset="100%" stop-color="#05080f"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#27d7ff"/>
    <stop offset="50%" stop-color="#b86cff"/>
    <stop offset="100%" stop-color="#ffd166"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#244169" stroke-width="1" opacity="0.38"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27d7ff"/></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffd166"/></marker>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .h { font-size: 46px; font-weight: 900; fill: #f7fbff; letter-spacing: 1.5px; }
    .sub { font-size: 22px; fill: #cfeaff; }
    .small { font-size: 17px; fill: #d7e9ff; }
    .micro { font-size: 14px; fill: #d7e9ff; }
    .dark { fill:#07111f; }
  </style>
</defs>
<rect width="1200" height="245" fill="url(#bg)"/>
<rect width="1200" height="245" fill="url(#grid)"/>
<text x="600" y="54" class="t h" text-anchor="middle">PROJECT FLOW</text>
<rect x="45" y="100" width="190" height="85" rx="18" fill="#0b1730" stroke="#27d7ff" stroke-width="3" opacity="1"/>
<text x="140" y="132" class="t small" text-anchor="middle">MNIST CSV</text>
<text x="140" y="162" class="t micro" text-anchor="middle">load labels + pixels</text>
<path d="M 245 142 L 295 142" stroke="#27d7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="280" y="100" width="190" height="85" rx="18" fill="#0b1730" stroke="#74e39a" stroke-width="3" opacity="1"/>
<text x="375" y="132" class="t small" text-anchor="middle">PREPROCESS</text>
<text x="375" y="162" class="t micro" text-anchor="middle">flatten + one-hot</text>
<path d="M 480 142 L 530 142" stroke="#27d7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="515" y="100" width="190" height="85" rx="18" fill="#0b1730" stroke="#b86cff" stroke-width="3" opacity="1"/>
<text x="610" y="132" class="t small" text-anchor="middle">TRAIN DNN</text>
<text x="610" y="162" class="t micro" text-anchor="middle">forward + loss + backprop</text>
<path d="M 715 142 L 765 142" stroke="#27d7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="750" y="100" width="190" height="85" rx="18" fill="#0b1730" stroke="#ffd166" stroke-width="3" opacity="1"/>
<text x="845" y="132" class="t small" text-anchor="middle">HONE STYLE</text>
<text x="845" y="162" class="t micro" text-anchor="middle">personal handwriting</text>
<path d="M 950 142 L 1000 142" stroke="#27d7ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="985" y="100" width="190" height="85" rx="18" fill="#0b1730" stroke="#ff7aa2" stroke-width="3" opacity="1"/>
<text x="1080" y="132" class="t small" text-anchor="middle">LIVE FEED</text>
<text x="1080" y="162" class="t micro" text-anchor="middle">classify new images</text>
<text x="600" y="220" class="t small" text-anchor="middle">The application is not “MNIST with a library.” It is MNIST as a test arena for a handwritten neural-network framework.</text>
</svg>
