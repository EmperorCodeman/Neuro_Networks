<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Verdict positive cautious improvement signal">

<style>
  .bg{fill:#08111f}.panel{fill:#111827;stroke:#38bdf8;stroke-width:3}.panel2{fill:#17112d;stroke:#a855f7;stroke-width:3}
  .grid{stroke:#243b63;stroke-width:1}.cyan{fill:#22d3ee}.pink{fill:#f472b6}.yellow{fill:#fde047}.green{fill:#4ade80}.purple{fill:#a78bfa}.orange{fill:#fb923c}.white{fill:#e5f2ff}.muted{fill:#94a3b8}
  .title{font-family:Arial,sans-serif;font-weight:700;font-size:44px}.sub{font-family:Arial,sans-serif;font-weight:700;font-size:22px}.small{font-family:Arial,sans-serif;font-weight:600;font-size:16px}.tiny{font-family:Arial,sans-serif;font-weight:600;font-size:12px}.mono{font-family:'Courier New',monospace;font-weight:700;font-size:18px}.monoSmall{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
</style>

<rect width="1100" height="340" rx="28" class="bg"/>
<text x="55" y="60" class="title white">Verdict from Current Build</text>
<rect x="72" y="100" width="450" height="155" rx="22" class="panel"/>
<text x="105" y="150" class="sub green">Coach Signal</text>
<text x="105" y="202" class="title yellow">+10.9%</text>
<text x="105" y="232" class="small muted">weighted non-trivial improvement estimate</text>
<rect x="585" y="100" width="445" height="155" rx="22" class="panel2"/>
<text x="620" y="150" class="sub pink">Honest Read</text>
<text x="620" y="190" class="small white">Combat output improved, but the sample is tiny.</text>
<text x="620" y="225" class="small muted">Cool project. Not a PhD dissertation.</text>
</svg>