<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Analysis pipeline from match stats to verdict">

<style>
  .bg{fill:#08111f}.panel{fill:#111827;stroke:#38bdf8;stroke-width:3}.panel2{fill:#17112d;stroke:#a855f7;stroke-width:3}
  .grid{stroke:#243b63;stroke-width:1}.cyan{fill:#22d3ee}.pink{fill:#f472b6}.yellow{fill:#fde047}.green{fill:#4ade80}.purple{fill:#a78bfa}.orange{fill:#fb923c}.white{fill:#e5f2ff}.muted{fill:#94a3b8}
  .title{font-family:Arial,sans-serif;font-weight:700;font-size:44px}.sub{font-family:Arial,sans-serif;font-weight:700;font-size:22px}.small{font-family:Arial,sans-serif;font-weight:600;font-size:16px}.tiny{font-family:Arial,sans-serif;font-weight:600;font-size:12px}.mono{font-family:'Courier New',monospace;font-weight:700;font-size:18px}.monoSmall{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
</style>

<rect width="1100" height="300" rx="26" class="bg"/>
<text x="45" y="52" class="title white">Analysis Pipeline</text>
<g transform="translate(45,105)">
  <rect x="0" y="0" width="145" height="98" rx="16" class="panel"/><text x="22" y="40" class="sub cyan">PRE</text><text x="18" y="70" class="tiny muted">baseline games</text>
  <path d="M160 50h55" stroke="#fde047" stroke-width="6" marker-end="url(#a)"/>
  <rect x="230" y="0" width="145" height="98" rx="16" class="panel2"/><text x="248" y="40" class="sub pink">POST</text><text x="250" y="70" class="tiny muted">after coach</text>
  <path d="M390 50h55" stroke="#fde047" stroke-width="6" marker-end="url(#a)"/>
  <rect x="460" y="0" width="145" height="98" rx="16" class="panel"/><text x="483" y="40" class="sub green">Z</text><text x="477" y="70" class="tiny muted">strangeness score</text>
  <path d="M620 50h55" stroke="#fde047" stroke-width="6" marker-end="url(#a)"/>
  <rect x="690" y="0" width="145" height="98" rx="16" class="panel2"/><text x="704" y="40" class="sub yellow">WEIGHT</text><text x="704" y="70" class="tiny muted">gameplay value</text>
  <path d="M850 50h55" stroke="#fde047" stroke-width="6" marker-end="url(#a)"/>
  <rect x="920" y="0" width="145" height="98" rx="16" class="panel"/><text x="938" y="40" class="sub orange">VERDICT</text><text x="942" y="70" class="tiny muted">coach signal</text>
</g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#fde047"/></marker></defs>
</svg>