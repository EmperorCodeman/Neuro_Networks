<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="Scoreboard of pre and post coach Fortnite metrics">

<style>
  .bg{fill:#08111f}.panel{fill:#111827;stroke:#38bdf8;stroke-width:3}.panel2{fill:#17112d;stroke:#a855f7;stroke-width:3}
  .grid{stroke:#243b63;stroke-width:1}.cyan{fill:#22d3ee}.pink{fill:#f472b6}.yellow{fill:#fde047}.green{fill:#4ade80}.purple{fill:#a78bfa}.orange{fill:#fb923c}.white{fill:#e5f2ff}.muted{fill:#94a3b8}
  .title{font-family:Arial,sans-serif;font-weight:700;font-size:44px}.sub{font-family:Arial,sans-serif;font-weight:700;font-size:22px}.small{font-family:Arial,sans-serif;font-weight:600;font-size:16px}.tiny{font-family:Arial,sans-serif;font-weight:600;font-size:12px}.mono{font-family:'Courier New',monospace;font-weight:700;font-size:18px}.monoSmall{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
</style>

<rect width="1100" height="470" rx="28" class="bg"/>
<text x="45" y="55" class="title white">Current Script Scoreboard</text>
<text x="45" y="87" class="small muted">The numbers are messy - which is exactly why the math matters.</text>
<text x="55" y="123" class="small white">Eliminations</text><rect x="255" y="105" width="163.4" height="18" rx="8" fill="#334155"/><text x="530" y="120" class="tiny muted">pre 0.80</text><rect x="255" y="133" width="260.0" height="18" rx="8" fill="#4ade80"/><text x="530" y="148" class="tiny white">post 1.27  (+59.1%)</text><text x="55" y="187" class="small white">Accuracy</text><rect x="255" y="169" width="260.0" height="18" rx="8" fill="#334155"/><text x="530" y="184" class="tiny muted">pre 25.7%</text><rect x="255" y="197" width="199.6" height="18" rx="8" fill="#fb7185"/><text x="530" y="212" class="tiny white">post 19.7%  (-23.2%)</text><text x="55" y="251" class="small white">Headshots</text><rect x="255" y="233" width="144.4" height="18" rx="8" fill="#334155"/><text x="530" y="248" class="tiny muted">pre 0.67</text><rect x="255" y="261" width="260.0" height="18" rx="8" fill="#4ade80"/><text x="530" y="276" class="tiny white">post 1.20  (+80.0%)</text><text x="55" y="315" class="small white">Damage Taken</text><rect x="255" y="297" width="238.2" height="18" rx="8" fill="#334155"/><text x="530" y="312" class="tiny muted">pre 208.60</text><rect x="255" y="325" width="260.0" height="18" rx="8" fill="#fb7185"/><text x="530" y="340" class="tiny white">post 227.70  (+9.2%)</text><text x="55" y="379" class="small white">Damage Dealt</text><rect x="255" y="361" width="231.5" height="18" rx="8" fill="#334155"/><text x="530" y="376" class="tiny muted">pre 218.40</text><rect x="255" y="389" width="260.0" height="18" rx="8" fill="#4ade80"/><text x="530" y="404" class="tiny white">post 245.30  (+12.3%)</text>
<g transform="translate(810,120)"><rect width="230" height="220" rx="20" class="panel2"/><text x="24" y="48" class="sub yellow">PATCH NOTES</text><text x="24" y="88" class="small white">+ kills</text><text x="24" y="120" class="small white">+ headshots</text><text x="24" y="152" class="small white">+ damage dealt</text><text x="24" y="184" class="small pink">- accuracy</text><text x="24" y="216" class="small pink">- took more damage</text></g>
</svg>