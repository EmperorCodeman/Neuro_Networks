<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Network architecture and training loop">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="55%" stop-color="#0f1933"/>
    <stop offset="100%" stop-color="#05080f"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#27d7ff"/>
