<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-label="Hypothesis testing as a boss fight">

<style>
  .bg{fill:#08111f}.panel{fill:#111827;stroke:#38bdf8;stroke-width:3}.panel2{fill:#17112d;stroke:#a855f7;stroke-width:3}
  .grid{stroke:#243b63;stroke-width:1}.cyan{fill:#22d3ee}.pink{fill:#f472b6}.yellow{fill:#fde047}.green{fill:#4ade80}.purple{fill:#a78bfa}.orange{fill:#fb923c}.white{fill:#e5f2ff}.muted{fill:#94a3b8}
  .title{font-family:Arial,sans-serif;font-weight:700;font-size:44px}.sub{font-family:Arial,sans-serif;font-weight:700;font-size:22px}.small{font-family:Arial,sans-serif;font-weight:600;font-size:16px}.tiny{font-family:Arial,sans-serif;font-weight:600;font-size:12px}.mono{font-family:'Courier New',monospace;font-weight:700;font-size:18px}.monoSmall{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
</style>

<rect width="1100" height="390" rx="28" class="bg"/>
<text x="55" y="55" class="title white">Hypothesis Testing = Boss Fight</text>
<text x="55" y="90" class="small muted">Two explanations enter the arena. The data decides which one survives.</text>
<rect x="65" y="130" width="430" height="165" rx="18" class="panel"/>
<text x="95" y="178" class="sub cyan">H0: Null Hypothesis</text>
<text x="95" y="215" class="small white">The coach did not change anything.</text>
<text x="95" y="248" class="monoSmall muted">Post-coach stats are just normal Fortnite variance.</text>
<rect x="605" y="130" width="430" height="165" rx="18" class="panel2"/>
<text x="635" y="178" class="sub pink">H1: Alternative</text>
<text x="635" y="215" class="small white">The coach moved the numbers.</text>
<text x="635" y="248" class="monoSmall muted">The post-coach sample looks meaningfully different.</text>
<path d="M515 212 C545 185 560 185 590 212" stroke="#fde047" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#fde047"/></marker></defs>
<text x="485" y="338" class="sub yellow">DATA RAID</text>
</svg>